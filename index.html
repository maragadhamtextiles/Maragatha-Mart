<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Essentials -->
    <title>Maragatha Mart — Silk Sarees, Textiles &amp; Everyday Essentials</title>
    <meta
      name="description"
      content="Maragatha Mart, Kayathar — Kanchipuram and soft silk sarees from Maragatha Silks, plus textiles, home, kitchen and gifting essentials. Shop online with delivery across India."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://maragathamart.com/" />

    <!-- Social Media: Open Graph (OG) -->
    <meta property="og:title" content="Maragatha Mart — Tradition Woven in Elegance" />
    <meta
      property="og:description"
      content="Silk sarees from Maragatha Silks and a curated range of everyday essentials, from Kayathar to your doorstep."
    />
    <meta property="og:image" content="https://maragathamart.com/assets/img/logo/maragatha-og.jpg" />
    <meta property="og:image:alt" content="Maragatha Mart emblem in gold on emerald" />
    <meta property="og:url" content="https://maragathamart.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Maragatha Mart" />

    <!-- Social Media: Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Maragatha Mart — Silk Sarees &amp; Everyday Essentials" />
    <meta
      name="twitter:description"
      content="Silk sarees from Maragatha Silks and a curated range of everyday essentials, delivered across India."
    />
    <meta name="twitter:image" content="https://maragathamart.com/assets/img/logo/maragatha-og.jpg" />

    <!-- Search Console verification for maragathamart.com goes here once the
         domain is added; the previous site's token was removed with it. -->

    <!-- Performance: Google Fonts Optimization -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
      async
      crossorigin="anonymous"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Lato:wght@300;400;700;900&display=swap"
      async
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
      rel="stylesheet"
      async
    />

    <!-- Favicon & PWA -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/img/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/img/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/img/favicon/favicon-16x16.png"
    />
    <!-- The manifest lives at the site root on purpose: start_url and scope
         resolve against the manifest's own URL, so one kept under
         /assets/img/favicon/ scoped the installed app to that folder. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Installing on iOS. Safari reads these rather than the manifest on
         anything before iOS 17.4, and Add to Home Screen opens inside Safari's
         chrome without the first one. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Maragatha Mart" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- The system bars follow the theme the app is actually showing. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#003620"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#071A13"
    />

    <!-- Structured Data (SEO Rich Snippets) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Maragatha Mart",
        "alternateName": "Maragatha Silks",
        "url": "https://maragathamart.com/",
        "logo": "https://maragathamart.com/assets/img/logo/maragatha-logo.jpg",
        "image": "https://maragathamart.com/assets/img/logo/maragatha-og.jpg",
        "slogan": "Tradition Woven in Elegance",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Kayathar",
          "addressRegion": "Tamil Nadu",
          "addressCountry": "IN"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
